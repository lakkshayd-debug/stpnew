# ONE-CLICK DEPLOY on Render's FREE tier (no credit card, no disk).
#
#   render.com -> New + -> Blueprint -> pick this repo -> Apply
#
# Creates: Postgres database + API (Docker) + website (static site).
# Photos you upload are stored INSIDE the database (STORAGE_DRIVER=db),
# because free services do not get a persistent disk.
#
# After the first deploy, if Render gave your services different names, open
#   shyam-timber-web -> Environment -> VITE_API_URL  = your API url
#   shyam-timber-api -> Environment -> CLIENT_URL    = your website url
# and redeploy both.

databases:
  - name: shyam-timber-db
    plan: free
    databaseName: shyam_timber
    user: shyam

services:
  - type: web
    name: shyam-timber-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: shyam-timber-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: STORAGE_DRIVER
        value: db                 # images live in Postgres - works without a paid disk
      - key: OWNER_PHONE
        value: '+916385340555'    # ONLY this number can log in as the owner
      - key: OTP_PROVIDER
        value: console            # switch to msg91 only after OTP_MODE=real + keys are set
      - key: OTP_MODE
        value: fake               # no SMS: owner 782751, every other number 123455. Set to 'real' when you buy an SMS plan
      - key: OWNER_OTP
        value: '782751'
      - key: CUSTOMER_OTP
        value: '123455'
      - key: MSG91_AUTH_KEY
        sync: false               # paste your key in the Render dashboard
      - key: MSG91_TEMPLATE_ID
        sync: false               # paste your DLT template id
      - key: MSG91_SENDER_ID
        value: SHYTMB
      - key: SEED_DEMO
        value: 'false'            # production: create the owner account only
      - key: PUBLIC_URL
        value: https://shyam-timber-api.onrender.com
      - key: CLIENT_URL
        value: https://shyam-timber-web.onrender.com

  - type: web
    name: shyam-timber-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://shyam-timber-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
