# Use this instead of render.yaml when the website is hosted on Vercel.
# Rename it to render.yaml before clicking Blueprint, or create the service manually.
databases:
  - name: shyam-timber-db
    plan: free
    databaseName: shyam_timber
    user: shyam
services:
  - type: web
    name: shyam-timber-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: shyam-timber-db, property: connectionString } }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: COOKIE_SECURE, value: 'true' }
      - { key: STORAGE_DRIVER, value: db }
      - { key: OTP_PROVIDER, value: console }
      - { key: PUBLIC_URL, value: https://shyam-timber-api.onrender.com }
      - { key: CLIENT_URL, value: https://REPLACE-ME.vercel.app }
